version: '3.9'

services:
  # База данных PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: routine_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    expose:
      - 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - ./.env

  # Брокер Redis
  redis:
    image: redis:7-alpine
    container_name: routine_redis
    restart: always
    expose:
      - 6379
    volumes:
      - redis_data:/data
    env_file:
      - ./.env

  # Веб-приложение Django
  web:
    image: ${DOCKER_USERNAME}/routine_master:${TAG:-latest}
    container_name: routine_web
    restart: always
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000
    expose:
      - 8000
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    environment:
      - "HOST=db"
      - "REDIS_HOST=redis"
    depends_on:
      - db
      - redis
    env_file:
      - ./.env

  # Веб-сервер Nginx
  nginx:
    image: nginx:1.25-alpine
    container_name: routine_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      - web

  # Celery для асинхронных задач
  celery:
    image: ${DOCKER_USERNAME}/routine_master:${TAG:-latest}
    container_name: routine_celery
    restart: always
    command: celery -A config worker -l INFO -P eventlet
    volumes:
      - .:/app
    environment:
      - "HOST=db"
      - "REDIS_HOST=redis"
    depends_on:
      - db
      - redis
    env_file:
      - ./.env

  # Планировщик Celery Beat
  celery_beat:
    image: ${DOCKER_USERNAME}/routine_master:${TAG:-latest}
    container_name: routine_celery_beat
    restart: always
    command: celery -A config beat -l INFO
    volumes:
      - .:/app
    environment:
      - "HOST=db"
      - "REDIS_HOST=redis"
    depends_on:
      - db
      - redis
    env_file:
      - ./.env

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
